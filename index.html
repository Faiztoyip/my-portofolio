<!DOCTYPE html>
<html lang="id">
<head>

  <!-- preload Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  >

  <noscript>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"

  </noscript>
  
  <!-- SEO Utama -->
  <title>Ahmad Fa'iz</title>

  <meta name="keywords" content="Ahmad Fa'iz, Data Analyst, Web Developer, S1 Teknik Informatika, Universitas Semarang, Portofolio Ahmad Fa'iz" />

  <meta property="og:title" content="Ahmad Fa'iz | Data Analyst & Web Developer" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:url" content="https://faiz.com/" />
  <meta name="twitter:title" content="Ahmad Fa'iz | Data Analyst & Web Developer" />
  <meta name="twitter:description" content="Website resmi dan portofolio Ahmad Fa'iz." />
  <meta name="twitter:image" content="https://faiz.com/Meta.png" />

  <!-- Canonical -->
  <link rel="canonical" href="https://faiz.com/" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Ahmad Fa'iz",
    "url": "https://faiz.com",
